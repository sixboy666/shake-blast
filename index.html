<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>SHAKE BLAST: FIZZ LAWSUIT</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { width:100%; height:100%; overflow:hidden; background:#0b0714;
    font-family:'Segoe UI',system-ui,-apple-system,Arial,sans-serif; user-select:none;
    overscroll-behavior:none; }
  #c { display:block; width:100%; height:100%; touch-action:none; cursor:pointer; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
'use strict';
/* ============================================================================
   SHAKE BLAST: FIZZ LAWSUIT  (v2 — skill-informed redesign)
   Small shake. Universal consequences.
   A music-first brainrot meme game. Single file, zero dependencies.
   Every sound is synthesized live with Web Audio.

   Applied skill guidance:
   - game-art: squash & stretch, anticipation wind-up, follow-through overshoot,
     arcs, slow in/out, secondary action (breathing/blink), exaggeration, appeal
   - game-audio: layered SFX (attack + body + tail + sweetener), 5 randomized
     pitch variants, vertical intensity layers, music ducking on the blast,
     silence/contrast rest beats, music sitting under the SFX
   - 2d-games: decaying 50-200ms screen shake, clear silhouettes
   - mobile-games: 44px+ touch targets, instant touch feedback, generous windows
   - web-games: AudioContext on first gesture, pooled particles, pause on hide
============================================================================ */

var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var W = 0, H = 0, DPR = 1;

/* ----------------------------- utilities -------------------------------- */
function clamp(v,a,b){ return v<a?a:(v>b?b:v); }
function rand(a,b){ return a+Math.random()*(b-a); }
function randi(a,b){ return Math.floor(rand(a,b)); }
function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }
/* compatible rounded rect (no ctx.roundRect dependency) */
function rr(x,y,w,h,r){
  r = Math.min(r, w/2, h/2);
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.lineTo(x+w-r,y);
  ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r);
  ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  ctx.lineTo(x+r,y+h);
  ctx.quadraticCurveTo(x,y+h,x,y+h-r);
  ctx.lineTo(x,y+r);
  ctx.quadraticCurveTo(x,y,x+r,y);
  ctx.closePath();
}
function easeOut(t){ return 1-Math.pow(1-t,3); }
function easeOutBack(t){ var c1=1.70158,c3=c1+1; return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2); }
function nowSec(){ return performance.now()/1000; }

/* =============================== AUDIO ================================== */
var AC = null, masterGain = null, musicBus = null, sfxBus = null, duckGain = null;
var noiseBuf = null, fizzSrc = null, fizzGain = null;
var muted = false;

function makeNoiseBuffer(){
  var len = AC.sampleRate * 1.0;
  var buf = AC.createBuffer(1,len,AC.sampleRate);
  var d = buf.getChannelData(0);
  for(var i=0;i<len;i++) d[i] = Math.random()*2-1;
  return buf;
}
function initAudio(){
  if(AC) return;
  AC = new (window.AudioContext||window.webkitAudioContext)();
  masterGain = AC.createGain(); masterGain.gain.value = 0.85; masterGain.connect(AC.destination);
  /* duck node lets the blast briefly push the music out of the way */
  duckGain = AC.createGain(); duckGain.gain.value = 1; duckGain.connect(masterGain);
  musicBus = AC.createGain(); musicBus.gain.value = 0.55; musicBus.connect(duckGain);
  sfxBus   = AC.createGain(); sfxBus.gain.value = 0.9;  sfxBus.connect(masterGain);
  noiseBuf = makeNoiseBuffer();
  /* continuous fizzy hiss, silent until shaken */
  fizzSrc = AC.createBufferSource(); fizzSrc.buffer = noiseBuf; fizzSrc.loop = true;
  var hp = AC.createBiquadFilter(); hp.type='highpass'; hp.frequency.value=4200;
  var lp = AC.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=9000;
  fizzGain = AC.createGain(); fizzGain.gain.value = 0;
  fizzSrc.connect(hp); hp.connect(lp); lp.connect(fizzGain); fizzGain.connect(sfxBus);
  fizzSrc.start();
  startBeatClock();
}
function setMuted(m){
  muted = m;
  if(masterGain) masterGain.gain.value = m ? 0 : 0.85;
}
/* brief music duck on explosions (game-audio skill) */
function duckMusic(){
  if(!AC || !duckGain) return;
  var t = AC.currentTime;
  duckGain.gain.cancelScheduledValues(t);
  duckGain.gain.setValueAtTime(duckGain.gain.value,t);
  duckGain.gain.linearRampToValueAtTime(0.38,t+0.02);
  duckGain.gain.linearRampToValueAtTime(1,t+0.48);
}

/* Low-level synth helpers ------------------------------------------------ */
function tone(type,freq,t,dur,peak,dest,glideTo){
  var o = AC.createOscillator();
  var g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(freq,t);
  if(glideTo) o.frequency.exponentialRampToValueAtTime(Math.max(1,glideTo),t+dur);
  g.gain.setValueAtTime(0.0001,t);
  g.gain.exponentialRampToValueAtTime(peak,t+0.008);
  g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g); g.connect(dest||sfxBus);
  o.start(t); o.stop(t+dur+0.03);
  return o;
}
function noiseHit(t,dur,type,freq,peak,Q,dest){
  var n = AC.createBufferSource(); n.buffer = noiseBuf;
  var f = AC.createBiquadFilter(); f.type = type; f.frequency.value = freq;
  if(Q) f.Q.value = Q;
  var g = AC.createGain();
  g.gain.setValueAtTime(peak,t);
  g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  n.connect(f); f.connect(g); g.connect(dest||sfxBus);
  n.start(t); n.stop(t+dur+0.03);
}

/* ------- beat clock: BPM may rise at level boundaries ------------------- */
var segments = [];           /* {b:beat, t:time, bpm:bpm} */
var nextStep = 0;             /* eighth-note step index (global) */
var timerID = null;
function bpmForLevel(L){ return Math.min(120 + L*4, 156); }

function beatToTime(b){
  var s = segments[segments.length-1];
  for(var i=segments.length-1;i>=0;i--){ if(b>=segments[i].b){ s=segments[i]; break; } }
  return s.t + (b - s.b)*(60/s.bpm);
}
function beatsAt(t){
  var s = segments[0];
  for(var i=0;i<segments.length;i++){ if(t>=segments[i].t) s=segments[i]; }
  return s.b + (t - s.t)*(s.bpm/60);
}
function startBeatClock(){
  var now = AC.currentTime + 0.08;
  segments = [{b:0, t:now, bpm:bpmForLevel(0)}];
  nextStep = 0;
  if(timerID) clearInterval(timerID);
  timerID = setInterval(scheduler, 25);
  scheduler();
}
/* Each level spans 16 beats. Shake starts on beat 3+16L, so the first BPM
   change for level 1's shake lands on global beat 19. */
var nextBpmChange = 19;
var clockLevel = 0;

function scheduler(){
  if(!AC) return;
  var horizon = AC.currentTime + 0.18;
  while(beatToTime(nextStep*0.5) < horizon){
    var gb = nextStep*0.5;               /* global beat (float) */
    if(gb >= nextBpmChange - 0.0001){
      clockLevel++;
      segments.push({b: nextBpmChange, t: beatToTime(nextBpmChange), bpm: bpmForLevel(clockLevel)});
      nextBpmChange += 16;
    }
    var t = beatToTime(gb);
    var inLoop = ((nextStep % 32) + 32) % 32;
    var beat = inLoop/2;                 /* 0..16 */
    var isBeat = (nextStep % 2 === 0);
    scheduleStep(t, beat, isBeat, inLoop);
    nextStep++;
  }
}

/* -------- the actual tune: catchy 4-beat cell, 16-beat loop ------------- */
var BASS = [55,0,0,55, 0,0,55,0, 49,0,0,49, 55,0,49,0];       /* per beat */
/* A-minor-pentatonic hook; values are semitone offsets from A4 (440), null=rest */
var NUL=null;
var LEAD = [
  0,NUL,3,NUL, 7,NUL,7,5, 3,NUL,0,NUL, NUL,-2,NUL,NUL,
  0,NUL,3,NUL, 7,NUL,12,10, 7,NUL,5,NUL, 3,NUL,NUL,NUL
];
/* layer-2 arpeggio (level 4+), semitone offsets from A5 */
var ARP = [0,3,7,12, 10,7,12,10, 7,3,7,10, 12,10,7,3];
function leadFreq(semi,base){ return (base||440)*Math.pow(2,semi/12); }

function scheduleStep(t, beat, isBeat, step){
  var rest = (state==='result');                 /* contrast: thin the groove */
  var lay1 = (!rest) && (level>=2 || combo>=5); /* shaker layer */
  var lay2 = (!rest) && level>=4;               /* arpeggio layer */

  /* KICK on beats */
  if(isBeat) kick(t, rest?0.5:0.75);
  /* HAT offbeats, louder late in the loop */
  if(!isBeat) hat(t, 0.05, (beat>=12?0.13:0.08) * (rest?0.6:1));
  /* SNARE on beats 4 and 12 */
  if(isBeat && (beat===4 || beat===12)) snare(t, rest?0.6:1);
  /* BASS */
  if(isBeat){
    var bi = Math.floor(beat) % 16;
    if(BASS[bi]){
      var bo=AC.createOscillator(), bg2=AC.createGain(), bf2=AC.createBiquadFilter();
      bo.type='sawtooth'; bo.frequency.value=BASS[bi];
      bf2.type='lowpass'; bf2.frequency.setValueAtTime(520,t);
      bf2.frequency.exponentialRampToValueAtTime(180,t+0.22);
      bg2.gain.setValueAtTime(0.0001,t);
      bg2.gain.exponentialRampToValueAtTime(0.21*(rest?0.6:1),t+0.01);
      bg2.gain.exponentialRampToValueAtTime(0.001,t+0.24);
      bo.connect(bf2); bf2.connect(bg2); bg2.connect(musicBus);
      bo.start(t); bo.stop(t+0.26);
    }
  }
  /* LEAD hook rests during the result card */
  if(!rest){
    var li = LEAD[step];
    if(li!==NUL && li!==undefined){
      var f = leadFreq(li);
      var o=AC.createOscillator(), g=AC.createGain();
      o.type='square'; o.frequency.value=f;
      g.gain.setValueAtTime(0.0001,t);
      g.gain.exponentialRampToValueAtTime(0.11,t+0.008);
      g.gain.exponentialRampToValueAtTime(0.001,t+0.19);
      o.connect(g); g.connect(musicBus);
      o.start(t); o.stop(t+0.21);
      /* sparkle octave */
      var o2=AC.createOscillator(), g2=AC.createGain();
      o2.type='triangle'; o2.frequency.value=f*2;
      g2.gain.setValueAtTime(0.0001,t);
      g2.gain.exponentialRampToValueAtTime(0.04,t+0.01);
      g2.gain.exponentialRampToValueAtTime(0.001,t+0.14);
      o2.connect(g2); g2.connect(musicBus);
      o2.start(t); o2.stop(t+0.16);
    }
  }
  /* LAYER 1: eighth-note shaker + open hat lift at beat 8 */
  if(lay1){
    noiseHit(t,0.045,'highpass',8200,0.05,0,musicBus);
    if(isBeat && beat===8) hat(t,0.16,0.16);
  }
  /* LAYER 2: pentatonic arpeggio plucks */
  if(lay2 && isBeat){
    var ab = Math.floor(beat)%16;
    var af = leadFreq(ARP[ab], 660);
    var ao=AC.createOscillator(), ag=AC.createGain();
    ao.type='triangle'; ao.frequency.value=af;
    ag.gain.setValueAtTime(0.0001,t);
    ag.gain.exponentialRampToValueAtTime(0.065,t+0.01);
    ag.gain.exponentialRampToValueAtTime(0.001,t+0.17);
    ao.connect(ag); ag.connect(musicBus);
    ao.start(t); ao.stop(t+0.19);
  }
  /* RISER into blast (musical beat 10) */
  if(beat===10){
    var n=AC.createBufferSource(); n.buffer=noiseBuf;
    var flt=AC.createBiquadFilter(); flt.type='bandpass'; flt.Q.value=1.2;
    flt.frequency.setValueAtTime(400,t);
    flt.frequency.exponentialRampToValueAtTime(6000,t+0.85);
    var ng=AC.createGain();
    ng.gain.setValueAtTime(0.001,t);
    ng.gain.exponentialRampToValueAtTime(0.15,t+0.8);
    ng.gain.exponentialRampToValueAtTime(0.001,t+0.92);
    n.connect(flt); flt.connect(ng); ng.connect(musicBus);
    n.start(t); n.stop(t+0.95);
    var ro=AC.createOscillator(), rg=AC.createGain();
    ro.type='sawtooth';
    ro.frequency.setValueAtTime(110,t);
    ro.frequency.exponentialRampToValueAtTime(880,t+0.85);
    rg.gain.setValueAtTime(0.001,t);
    rg.gain.exponentialRampToValueAtTime(0.08,t+0.8);
    rg.gain.exponentialRampToValueAtTime(0.001,t+0.92);
    ro.connect(rg); rg.connect(musicBus);
    ro.start(t); ro.stop(t+0.95);
  }
  /* BEAT 11 groove accent — the full stinger only fires when the player
      actually lands the blast (see sfxBlast) */
  if(beat===11 && isBeat){
    kick(t,0.55);
    noiseHit(t,0.32,'highpass',2600,0.12,0,musicBus);
  }
}
function kick(t,vol){
  var k = AC.createOscillator(), kg = AC.createGain();
  k.type='sine';
  k.frequency.setValueAtTime(150,t);
  k.frequency.exponentialRampToValueAtTime(46,t+0.11);
  kg.gain.setValueAtTime(vol,t);
  kg.gain.exponentialRampToValueAtTime(0.001,t+0.16);
  k.connect(kg); kg.connect(musicBus); k.start(t); k.stop(t+0.18);
}
function hat(t,dur,vol){
  var n=AC.createBufferSource(); n.buffer=noiseBuf;
  var f=AC.createBiquadFilter(); f.type='highpass'; f.frequency.value=7200;
  var g=AC.createGain();
  g.gain.setValueAtTime(vol,t);
  g.gain.exponentialRampToValueAtTime(0.001,t+dur);
  n.connect(f); f.connect(g); g.connect(musicBus);
  n.start(t); n.stop(t+dur+0.02);
}
function snare(t,scale){
  var n=AC.createBufferSource(); n.buffer=noiseBuf;
  var f=AC.createBiquadFilter(); f.type='bandpass'; f.frequency.value=1900; f.Q.value=0.8;
  var g=AC.createGain();
  g.gain.setValueAtTime(0.27*scale,t);
  g.gain.exponentialRampToValueAtTime(0.001,t+0.14);
  n.connect(f); f.connect(g); g.connect(musicBus);
  n.start(t); n.stop(t+0.16);
  var o=AC.createOscillator(), og=AC.createGain();
  o.type='triangle'; o.frequency.setValueAtTime(210,t);
  o.frequency.exponentialRampToValueAtTime(120,t+0.1);
  og.gain.setValueAtTime(0.17*scale,t);
  og.gain.exponentialRampToValueAtTime(0.001,t+0.12);
  o.connect(og); og.connect(musicBus);
  o.start(t); o.stop(t+0.14);
}

/* ------------------------- layered gameplay SFX ------------------------- */
/* Every shake hit: transient attack + liquid body + fizz tail + random
   sweetener. Five pitch/timbre variants so repeats never feel identical. */
function sfxHit(combo, perfect){
  if(!AC) return;
  var t = AC.currentTime;
  var v = randi(0,5);
  var m = Math.pow(2, [-2,0,1,3,5][v]/12);
  /* ATTACK: crisp click */
  tone('square', (perfect?880:700)*m, t, 0.035, perfect?0.17:0.12);
  /* BODY: filtered noise thump */
  noiseHit(t, 0.075, 'lowpass', (1300+Math.min(combo,20)*110)*m, 0.2);
  /* BODY: low liquid tone dropping */
  tone('sine', 175*m, t, 0.09, 0.16, sfxBus, 88*m);
  /* TAIL: fizz sparkle */
  noiseHit(t+0.02, 0.13, 'highpass', 6300, 0.045);
  /* SWEETENER: random pentatonic glug */
  var glf = [523,587,659,784,880][v];
  tone('triangle', glf, t+0.012, 0.11, 0.1, sfxBus, glf*0.72);
  /* perfect hits get a tiny two-plink shine on top */
  if(perfect) tone('triangle', 1175*m, t+0.045, 0.1, 0.07);
}
function sfxMiss(){
  if(!AC) return;
  var t = AC.currentTime;
  var m = Math.pow(2, pick([-3,-1,0,2])/12);
  noiseHit(t, 0.12, 'lowpass', 900*m, 0.2);
  tone('sawtooth', 220*m, t, 0.22, 0.14, sfxBus, 80*m);
  tone('square', 160*m, t+0.02, 0.16, 0.06, sfxBus, 70*m);
}
/* The big one: crack + crash + sub + chord voicing + sparkle, randomized. */
var BLAST_VOICINGS = [
  [220,277.2,329.6,440,554.4],
  [196,246.9,293.7,392,493.9],
  [246.9,311.1,370,493.9,622.3],
  [174.6,220,261.6,349.2,440],
  [220,261.6,349.2,440,523.3]
];
function sfxBlast(perfect){
  if(!AC) return;
  var t = AC.currentTime;
  var v = randi(0,5);
  /* ATTACK: instant crack */
  noiseHit(t, 0.06, 'highpass', 3300, 0.4);
  /* TAIL: long crash */
  noiseHit(t, 0.8, 'highpass', 2400, 0.3);
  /* BODY: sub boom */
  tone('sine', 150, t, 0.55, 0.45, sfxBus, 36);
  /* BODY: chord stab, voicing variant */
  BLAST_VOICINGS[v].forEach(function(fr,i){
    tone(i<2?'sawtooth':'square', fr, t, 0.55, 0.06);
  });
  /* SWEETENER: perfect sparkle cascade */
  if(perfect){
    var base = 880*Math.pow(2, [0,2,-2][v%3]/12);
    for(var i=0;i<5;i++){
      tone('triangle', base*Math.pow(2,[0,3,5,7,12][i]/12), t+0.02+i*0.06, 0.12, 0.08);
    }
  }
  duckMusic();
}
/* Sad fizzle when the blast is missed */
function sfxDud(){
  if(!AC) return;
  var t = AC.currentTime;
  noiseHit(t, 0.18, 'lowpass', 700, 0.18);
  tone('square', 330, t, 0.18, 0.1, sfxBus, 150);
  tone('square', 247, t+0.17, 0.26, 0.09, sfxBus, 110);
}
function sfxBonus(){
  if(!AC) return;
  var t = AC.currentTime;
  var root = 523*Math.pow(2, pick([0,2])/12);
  [0,4,7,12].forEach(function(s,i){
    tone('square', root*Math.pow(2,s/12), t+i*0.05, 0.1, 0.09);
  });
  noiseHit(t, 0.25, 'highpass', 7000, 0.045);
}
function sfxClick(){
  if(!AC) return;
  tone('triangle', pick([520,580,640,700]), AC.currentTime, 0.06, 0.13, sfxBus,
       pick([680,760,840,920]));
}
/* countdown ticks, rising urgency */
function sfxTick(i){
  if(!AC) return;
  var t = AC.currentTime;
  tone('square', [600,700,820][i], t, 0.07, 0.11);
  noiseHit(t, 0.03, 'highpass', 7500, 0.04);
}
function sfxGo(){
  if(!AC) return;
  var t = AC.currentTime;
  kick(t,0.8);
  [440,554,659].forEach(function(f){ tone('triangle', f, t, 0.14, 0.13); });
}
/* rhythm-synced crazy beat: zip + party horn */
function sfxCrazy(){
  if(!AC) return;
  var t = AC.currentTime;
  tone('sawtooth', 250, t, 0.28, 0.12, sfxBus, 1400);
  noiseHit(t, 0.28, 'highpass', 5200, 0.07);
  tone('square', 180, t+0.05, 0.3, 0.14, sfxBus, 360);
}

/* ============================ STAGES ==================================== */
var STAGES = [
  { name:'THE KITCHEN', bg1:'#3a1d12', bg2:'#7a3520', accent:'#ffb347', accent2:'#ff5e62',
    liquid:'#ff7a3d', label:'FIZZ ORIGINAL', cap:'#e23b3b' },
  { name:'NEON ROOFTOP', bg1:'#160b33', bg2:'#4d1fa8', accent:'#22e1ff', accent2:'#ff4fd8',
    liquid:'#b14dff', label:'MIDNIGHT COLA', cap:'#ff4fd8' },
  { name:'OHIO MALL', bg1:'#0d3440', bg2:'#127e96', accent:'#ffe066', accent2:'#5cf2c5',
    liquid:'#5cf2c5', label:'MYSTIC SPRITE', cap:'#ffe066' },
  { name:'THE COURT', bg1:'#10241b', bg2:'#2f5a41', accent:'#f4e9c8', accent2:'#d8a74a',
    liquid:'#c9a227', label:'EVIDENCE SODA', cap:'#8a5a2b' },
  { name:'THE VOID', bg1:'#040214', bg2:'#1a0f4a', accent:'#9d6bff', accent2:'#42f5d7',
    liquid:'#42a5f5', label:'VOID FIZZ', cap:'#9d6bff' }
];
var stageIdx = 0;

/* ======================== PARTICLES (pooled) ============================ */
var PMAX = 190;
var px=new Array(PMAX), py=new Array(PMAX), pvx=new Array(PMAX), pvy=new Array(PMAX);
var pLife=new Array(PMAX), pMax=new Array(PMAX), pSize=new Array(PMAX);
var pType=new Array(PMAX), pHue=new Array(PMAX), pSpin=new Array(PMAX), pRot=new Array(PMAX);
var pCount=0;
function pSpawn(x,y,vx,vy,life,size,type,hue){
  if(pCount>=PMAX){
    /* overwrite oldest */
    var idx0=0, ol=1e9;
    for(var q=0;q<PMAX;q++){ if(pLife[q]<ol){ol=pLife[q];idx0=q;} }
    var j=idx0;
  } else { var j=pCount; pCount++; }
  px[j]=x; py[j]=y; pvx[j]=vx; pvy[j]=vy; pLife[j]=life; pMax[j]=life;
  pSize[j]=size; pType[j]=type; pHue[j]=hue; pSpin[j]=rand(-6,6); pRot[j]=rand(0,6.28);
}
function pReset(){ pCount=0; }
function pUpdate(dt){
  for(var i=0;i<pCount;i++){
    pLife[i]-=dt;
    if(pLife[i]<=0) continue;
    pRot[i]+=pSpin[i]*dt;
    switch(pType[i]){
      case 0: /* bubble */
        py[i]+=pvy[i]*dt; px[i]+=Math.sin((pMax[i]-pLife[i])*3+i)*14*dt;
        break;
      case 1: /* smoke/ember drifting */
        px[i]+=pvx[i]*dt; py[i]+=pvy[i]*dt + Math.sin((pMax[i]-pLife[i])*5)*6*dt;
        break;
      case 2: /* confetti */
        py[i]+=pvy[i]*dt; px[i]+=pvx[i]*dt + Math.sin((pMax[i]-pLife[i])*2)*18*dt;
        break;
      case 3: /* paper */
        px[i]+=pvx[i]*dt; py[i]+=pvy[i]*dt;
        break;
      case 4: /* star */
        px[i]+=pvx[i]*dt; py[i]+=pvy[i]*dt;
        break;
      case 5: /* spray / trail */
        pvy[i]+=620*dt;
        px[i]+=pvx[i]*dt; py[i]+=pvy[i]*dt;
        break;
    }
  }
  /* compact dead particles when nearly full */
  if(pCount>PMAX-2){
    var w=0;
    for(var r=0;r<pCount;r++){
      if(pLife[r]>0){
        if(w!==r){
          px[w]=px[r];py[w]=py[r];pvx[w]=pvx[r];pvy[w]=pvy[r];
          pLife[w]=pLife[r];pMax[w]=pMax[r];pSize[w]=pSize[r];
          pType[w]=pType[r];pHue[w]=pHue[r];pSpin[w]=pSpin[r];pRot[w]=pRot[r];
        }
        w++;
      }
    }
    pCount=w;
  }
}
function pDraw(){
  for(var i=0;i<pCount;i++){
    if(pLife[i]<=0) continue;
    var a=clamp(pLife[i]/pMax[i],0,1);
    ctx.save();
    ctx.globalAlpha = pType[i]===5 ? a*0.85 : a*0.9;
    ctx.translate(px[i],py[i]); ctx.rotate(pRot[i]);
    var col = pHue[i];
    ctx.fillStyle=col; ctx.strokeStyle=col;
    var sz=pSize[i];
    switch(pType[i]){
      case 0:
        ctx.lineWidth=1.5;
        ctx.beginPath(); ctx.arc(0,0,sz,0,6.283); ctx.stroke();
        ctx.globalAlpha*=0.6;
        ctx.beginPath(); ctx.arc(-sz*0.3,-sz*0.3,sz*0.25,0,6.283); ctx.fill();
        break;
      case 1:
        ctx.beginPath(); ctx.arc(0,0,sz,0,6.283); ctx.fill();
        break;
      case 2:
        ctx.fillRect(-sz,-sz*0.5,sz*2,sz);
        break;
      case 3:
        ctx.fillRect(-sz,-sz*0.7,sz*2,sz*1.4);
        ctx.globalAlpha*=0.7;
        ctx.strokeStyle='#7a5c2e';
        ctx.strokeRect(-sz*0.5,-sz*0.3,sz,sz*0.6);
        break;
      case 4:
        ctx.beginPath();
        ctx.moveTo(0,-sz); ctx.lineTo(sz*0.35,0); ctx.lineTo(0,sz); ctx.lineTo(-sz*0.35,0);
        ctx.closePath(); ctx.fill();
        break;
      case 5:
        ctx.beginPath(); ctx.arc(0,0,sz,0,6.283); ctx.fill();
        break;
    }
    ctx.restore();
  }
}

/* ambient emission per stage — distinct particle language for each scene */
var emitAcc=0;
function emitAmbient(dt,intensity){
  emitAcc += dt*(26+intensity*40);
  while(emitAcc>=1){
    emitAcc-=1;
    switch(stageIdx){
      case 0:
        pSpawn(rand(0,W), H+10, 0, rand(-46,-24), rand(3,6), rand(3,9),0,
          STAGES[stageIdx].accent); break;
      case 1:
        pSpawn(-10, rand(H*0.3,H), rand(20,55), rand(-14,-2), rand(4,8), rand(5,16),1,
          Math.random()<0.5?STAGES[stageIdx].accent:STAGES[stageIdx].accent2); break;
      case 2:
        pSpawn(rand(0,W), -10, rand(-14,14), rand(28,60), rand(3,6), rand(3,7),2,
          Math.random()<0.5?STAGES[stageIdx].accent:STAGES[stageIdx].accent2); break;
      case 3:
        pSpawn(rand(0,W), -10, rand(-24,24), rand(18,40), rand(4,8), rand(7,14),3,
          STAGES[stageIdx].accent); break;
      case 4:
        pSpawn(rand(0,W), rand(0,H), 0, 0, rand(1.2,3), rand(1.5,4),4,

}

/* ----------------------- touch feedback ripples ------------------------- */
var ripples = [];
function addRipple(x,y,col){ ripples.push({x:x,y:y,t:0.45,col:col}); }
function rippleUpdate(dt){
  for(var i=ripples.length-1;i>=0;i--){
    ripples[i].t-=dt;
    if(ripples[i].t<=0) ripples.splice(i,1);
  }
}
function drawRipples(){
  for(var i=0;i<ripples.length;i++){
    var r=ripples[i];
    var p=1-r.t/0.45;
    ctx.save();
    ctx.globalAlpha=(1-p)*0.7;
    ctx.strokeStyle=r.col; ctx.lineWidth=3;
    ctx.beginPath(); ctx.arc(r.x,r.y, 10+p*38, 0,6.283); ctx.stroke();
    ctx.globalAlpha=(1-p)*0.25;
    ctx.fillStyle=r.col;
    ctx.beginPath(); ctx.arc(r.x,r.y, 10+p*38, 0,6.283); ctx.fill();
    ctx.restore();
  }
}

var levelStartBeat=0;

/* ------------------------------ input ----------------------------------- */
function press(){
  if(state==='title'||state==='over') return;   /* buttons handle those */
  if(state!=='shake' && state!=='blast' && state!=='countdown') return;
  if(!AC) return;
  var bf=beatsAt(AC.currentTime);
  var rel=bf-levelStartBeat;
  if(state==='countdown') return;
  if(state==='shake'){
    /* find nearest unhit shake beat */
    var bestK=-1, bestD=9;
    for(var k=0;k<8;k++){
      if(hitFlags[k]) continue;
      var d=Math.abs(rel-k);
      if(d<bestD){ bestD=d; bestK=k; }
    }
    var goodW = goodWindow();
    if(bestK>=0 && bestD<=goodW){
      registerShake(bestK,bestD);
    } else {
      registerWeak(bestD<=0.34?bestK:-1);
    }
    return;
  }
  if(state==='blast'){
    var d9=rel-9;
    if(Math.abs(d9)<=0.32){
      doBlast(Math.abs(d9));
    } else if(d9<0){
      addJudgment('TOO SOON','#ff9f43');
      sfxMiss(); combo=0;
      addRipple(pointer.x,pointer.y,'#ff9f43');
    } else {
      addJudgment('TOO LATE','#ff9f43');
      sfxClick();
      addRipple(pointer.x,pointer.y,'#ff9f43');
    }
  }
}
function perfWindow(){ return clamp(0.13-level*0.006,0.085,0.13); }
function goodWindow(){ return clamp(0.24-level*0.008,0.16,0.24); }

function registerShake(k,d){
  hitFlags[k]=true;
  combo++; maxCombo=Math.max(maxCombo,combo);
  var perfect = d<=perfWindow();
  var gain = perfect ? 0.13 : 0.085;
  fizz=clamp(fizz+gain,0,1);
  var pts = (perfect?100:50) + combo*10;
  score += pts;
  /* spring impulse: anticipation wind-up happens just before this frame */
  var dir=(k%2===0?1:-1);
  bRotV += dir*(perfect?7.5:5);
  hitKick=1;
  sfxHit(combo,perfect);
  if(perfect) addJudgment('PERFECT','#38f5a4');
  else addJudgment('GOOD','#7fd8ff');
  addRipple(pointer.x,pointer.y,perfect?'#38f5a4':'#7fd8ff');
  floatScore.push({x:W/2,y:H*0.42,t:0.8,txt:'+'+pts,col:perfect?'#38f5a4':'#7fd8ff'});
  beatBurst(perfect);
}
function registerWeak(k){
  combo=0;
  addJudgment('WEAK!','#ff9f43');
  sfxMiss();
  bRotV += pick([-3,3]);
  addRipple(pointer.x,pointer.y,'#ff9f43');
  addShake(3,0.1);
}
function missBeat(k){
  combo=0; lives--;
  hitFlags[k]=true;
  addJudgment('MISS','#ff5e62');
  sfxMiss();
  addShake(5,0.14);
  if(lives<=0) gameOver();
}
function doBlast(d){
  blastDone=true;
  lastBlastDelta=d;
  var perfect=d<=perfWindow();
  blastWasPerfect=perfect;
  sfxBlast(perfect);
  addShake(perfect?18:13, 0.18);
  hitKick=1;
  /* cap flies */
  var u=unit();
  capFlight={x:W/2, y:bottleY()-158*u, vx:rand(260,420)*u, vy:-rand(560,720)*u, t:0, dur:1.15, perfect:perfect};
  /* score */
  var pts = Math.round(fizz*900*(perfect?2:1)*(1+combo*0.08)*(level+1)*nextMult);
  score+=pts;
  floatScore.push({x:W/2,y:bottleY()-180*u,t:1.2,txt:'+'+pts,col:perfect?'#ffe066':'#ffffff'});
  addJudgment(perfect?'BLAST PERFECT':'BLAST!', perfect?'#ffe066':'#5cf2c5');
  if(nextMult>1) sfxBonus();
  if(perfect && Math.random()<0.5) sfxBonus();
  geyserAcc=0.55;
}
function blastMissed(){
  if(blastDone) return;
  blastDone=true;
  combo=0; lives--;
  addJudgment('FIZZ FIZZLED','#ff5e62');
  sfxDud();
  addShake(4,0.16);
  hitKick=0.6;
  fizz*=0.3;
  if(lives<=0) gameOver();
}
function gameOver(){
  state='over';
  if(score>best){
    best=score;
    try{ localStorage.setItem('shakeblast_best',String(best)); }catch(e){}
  }
  if(AC && fizzGain){
    fizzGain.gain.cancelScheduledValues(AC.currentTime);
    fizzGain.gain.setValueAtTime(0,AC.currentTime);
  }
}
/* decaying 50-200ms screen shake (2d-games skill) */
function addShake(pow,dur){
  shakePow=pow; shakeDur=dur; shakeT=dur;
}

/* ------------------------- floating texts ------------------------------- */
function addJudgment(txt,col){

function fxUpdate(dt){
  for(var i=judgments.length-1;i>=0;i--){
    judgments[i].t-=dt; judgments[i].y-=42*dt;
    if(judgments[i].t<=0) judgments.splice(i,1);

}

/* ------------------------- beat-synced bursts --------------------------- */
function beatBurst(perfect){

/* the rhythm-synced random crazy event at beat 6 */
function triggerCrazy(){

/* ============================ UPDATE ==================================== */
var lastT=performance.now();
function frame(now){
  var dt=Math.min(0.05,(now-lastT)/1000);
  lastT=now;
  titleBob+=dt;
  update(dt);
  render();
  requestAnimationFrame(frame);
}
function unit(){ return clamp(Math.min(W,H)/400,0.62,1.7); }
function bottleY(){ return H*0.56; }

/* squash-and-stretch kick: fast compress, overshoot stretch, settle */
function kickVals(p){
  if(p<=0) return [1,1];
  if(p>0.7){
    var q=(1-p)/0.3;
    return [1+q*0.15, 1-q*0.17];
  }
  var o=Math.sin(((0.7-p)/0.7)*Math.PI)*0.08;
  return [1-o*0.9, 1+o];
}
var bottleSquashX=1, bottleSquashY=1;

function update(dt){
  /* beat tracking */
  if(AC && state!=='title' && state!=='over'){
    var bf=beatsAt(AC.currentTime);
    var fl=Math.floor(bf);
    if(fl!==lastBeatFloor){
      lastBeatFloor=fl;
      beatPulse=1;
    }
    beatPulse=Math.max(0,beatPulse-dt*3.4);

    var rel=bf-levelStartBeat;

    if(state==='countdown'){
      /* schedule 3-2-1 ticks precisely on their beats */
      for(var c=0;c<3;c++){
        if(!countS[c] && rel>=-3+c){ countS[c]=true; sfxTick(c); }
      }
      if(!goSounded && rel>=0){ goSounded=true; sfxGo(); }
      if(rel>=0){
        state='shake';
        for(var i=0;i<8;i++) hitFlags[i]=false;
        blastDone=false;
      }
    }
    if(state==='shake'){
      for(var k=0;k<8;k++){
        if(!hitFlags[k] && rel>k+goodWindow()) missBeat(k);
      }
      /* random crazy event, locked to beat 6 */
      if(crazyBeat && !crazyDone && rel>=6) triggerCrazy();
      if(rel>=8.5) state='blast';
    }
    if(state==='blast'){
      if(!blastDone && rel>9.45) blastMissed();
      if(rel>=10.2){
        state='result';
        currentEvent=rollEvent(blastWasPerfect);
      }
    }
    if(state==='result'){
      if(rel>=16){
        if(lives>0){ nextLevel(); state='countdown'; }
      }
    }
    /* fizz hiss gain follows the action */
    if(fizzGain){
      var target=0;
      if(state==='shake') target=0.03+fizz*0.07;
      else if(state==='blast' && !blastDone) target=0.02+fizz*0.05;
      fizzGain.gain.setTargetAtTime(target,AC.currentTime,0.05);
    }
  }

  /* rotation spring: stiffness + damping yields one-overshoot follow-through */
  bRotV += (-bRot*120 - bRotV*9.5)*dt;
  bRot += bRotV*dt;
  hitKick=Math.max(0,hitKick-dt*3.2);
  spinT=Math.max(0,spinT-dt);
  shakeT=Math.max(0,shakeT-dt);

  /* breathing secondary action, combined with the hit kick */
  var breathing=Math.sin(nowSec()*2.1)*0.012;
  var kv=kickVals(hitKick);
  bottleSquashX = kv[0]*(1+breathing);
  bottleSquashY = kv[1]*(1-breathing);

  /* cap flight */
  if(capFlight){
    capFlight.t+=dt;
    capFlight.vy+=900*dt;
    capFlight.x+=capFlight.vx*dt;
    capFlight.y+=capFlight.vy*dt;
    var s=STAGES[stageIdx];
    if(Math.random()<0.9){
      pSpawn(capFlight.x,capFlight.y,rand(-30,30),rand(-30,30),rand(0.3,0.6),
        rand(2,5),5,capFlight.perfect?s.accent2:s.accent);
    }
    if(capFlight.t>capFlight.dur||capFlight.y>H+80||capFlight.x>W+80) capFlight=null;
  }
  /* geyser */
  if(geyserAcc>0){
    geyserAcc-=dt;
    var u=unit(), gx=W/2, gy=bottleY()-158*u;
    for(var g=0;g<6;g++){
      pSpawn(gx+rand(-14,14)*u,gy,rand(-90,90)*u,rand(-460,-260)*u,
        rand(0.5,1.1),rand(2.5,6),5,Math.random()<0.6?'#ffffff':STAGES[stageIdx].accent);
    }
  }

  rippleUpdate(dt);
  fxUpdate(dt);
  var chaos=state==='title'?0:level;
  emitAmbient(dt,clamp(chaos*0.25,0,3));
  pUpdate(dt);
}

/* ============================ RENDER ==================================== */
function render(){
  var s=STAGES[stageIdx];
  ctx.clearRect(0,0,W,H);
  ctx.save();
  /* decaying screen shake applied to the whole frame */
  if(shakeT>0){
    var k=shakeT/shakeDur;
    ctx.translate(rand(-1,1)*shakePow*k, rand(-1,1)*shakePow*k);
    ctx.rotate(rand(-1,1)*0.007*k);
  }
  drawBackground(s);
  pDraw();
  drawRipples();
  if(state==='title'){ drawTitle(s); ctx.restore(); return; }
  drawBeatRings(s);
  drawBottle(s);
  drawCap(s);
  drawHUD(s);
  drawFloaters(s);
  if(state==='countdown') drawCountdown(s);
  if(state==='blast') drawBlastBanner(s);
  if(state==='result' && currentEvent) drawEvent(s);
  if(state==='over') drawGameOver(s);
  drawMute(s);
  ctx.restore();
}

function drawBackground(s){
  /* slightly overscanned so screen shake never exposes bare edges */
  var g=ctx.createLinearGradient(0,-24,0,H+24);
  g.addColorStop(0,s.bg1); g.addColorStop(1,s.bg2);
  ctx.fillStyle=g; ctx.fillRect(-26,-26,W+52,H+52);
  ctx.save();
  ctx.globalAlpha=0.5;
  /* stage signature decor */
  if(stageIdx===0){
    /* kitchen tiles + counter */
    ctx.strokeStyle='rgba(255,255,255,0.08)'; ctx.lineWidth=2;
    for(var y=H*0.72;y<H;y+=46){ ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke(); }
    for(var x=0;x<W;x+=46){ ctx.beginPath();ctx.moveTo(x,H*0.72);ctx.lineTo(x,H);ctx.stroke(); }
    ctx.fillStyle='rgba(0,0,0,0.25)'; ctx.fillRect(0,H*0.72-10,W,14);
  } else if(stageIdx===1){
    /* skyline windows (deterministic heights — no flicker) */
    for(var b=0;b<7;b++){
      var bw=W/7, bh=70+((b*53)%110);
      ctx.fillStyle='rgba(0,0,0,0.3)';
      ctx.fillRect(b*bw+6,H*0.72-bh,bw-12,bh);
      ctx.fillStyle='rgba(255,224,102,0.35)';
      for(var wy=H*0.72-bh+10;wy<H*0.72-12;wy+=22)
        for(var wx=b*bw+12;wx<(b+1)*bw-14;wx+=20)
          if(((wx+wy+b*7)%3)!==0) ctx.fillRect(wx,wy,7,9);
    }
  } else if(stageIdx===2){
    /* glossy mall bands */
    ctx.fillStyle='rgba(255,255,255,0.07)';
    ctx.save(); ctx.translate(0,H*0.5); ctx.rotate(-0.12);
    ctx.fillRect(-40,-H, W+80, 46); ctx.fillRect(-40,H*0.25,W+80,26);
    ctx.restore();
    ctx.fillStyle='rgba(0,0,0,0.22)'; ctx.fillRect(0,H*0.74,W,H*0.26);
  } else if(stageIdx===3){
    /* court columns */
    ctx.fillStyle='rgba(0,0,0,0.28)';
    for(var c=0;c<4;c++){
      var cx2=W*(0.14+c*0.24);
      ctx.fillRect(cx2-22,H*0.16,44,H*0.56);
      ctx.fillRect(cx2-30,H*0.12,60,14);
      ctx.fillRect(cx2-30,H*0.70,60,14);
    }
  } else {
    /* ringed planet */
    ctx.globalAlpha=0.18;
    ctx.fillStyle=s.accent;
    ctx.beginPath(); ctx.arc(W*0.82,H*0.2,Math.min(W,H)*0.14,0,6.28);ctx.fill();
    ctx.strokeStyle='rgba(255,255,255,0.25)'; ctx.lineWidth=3;
    ctx.beginPath(); ctx.ellipse(W*0.82,H*0.2,Math.min(W,H)*0.22,Math.min(W,H)*0.07,-0.4,0,6.28);ctx.stroke();
  }
  ctx.restore();
  /* music pulse vignette */
  var vg=ctx.createRadialGradient(W/2,H*0.5,Math.min(W,H)*0.3,W/2,H*0.5,Math.max(W,H)*0.75);
  vg.addColorStop(0,'rgba(0,0,0,0)');
  vg.addColorStop(1,'rgba(0,0,0,'+(0.35+beatPulse*0.12)+')');
  ctx.fillStyle=vg; ctx.fillRect(-26,-26,W+52,H+52);
}

/* ---- beat rings: shrinking target ring on next beat, pulse behind ------ */
function drawBeatRings(s){
  var cx=W/2, cy=bottleY(), u=unit();
  if(!AC) return;
  var bf=beatsAt(AC.currentTime), rel=bf-levelStartBeat;

  /* expanding pulse */
  var frac=bf-Math.floor(bf);
  ctx.save();
  ctx.globalAlpha=(1-frac)*0.35;
  ctx.strokeStyle=s.accent; ctx.lineWidth=3*u;
  ctx.beginPath(); ctx.arc(cx,cy,(95+frac*70)*u,0,6.28); ctx.stroke();
  ctx.restore();

  if(state==='shake'){
    /* find upcoming beat and show shrinking target */
    for(var k=0;k<8;k++){
      if(!hitFlags[k] && rel<k+goodWindow() && rel>k-1){
        var prog=clamp(rel-(k-1),0,1);        /* 0..1 shrinking over 1 beat */
        var rad=(150-prog*55)*u;
        var within=Math.abs(rel-k)<=goodWindow();
        ctx.save();
        ctx.globalAlpha=0.85;
        ctx.strokeStyle=within?s.accent2:'rgba(255,255,255,0.55)';
        ctx.lineWidth=(within?4:2.5)*u;
        ctx.beginPath(); ctx.arc(cx,cy,rad,0,6.28); ctx.stroke();
        if(within){
          ctx.globalAlpha=0.9; ctx.fillStyle=s.accent;
          ctx.font='bold '+Math.round(13*u)+'px Segoe UI';
          ctx.textAlign='center';
          ctx.fillText(k===7?'LAST SHAKE':'SHAKE',cx,cy+rad+20*u);
        }
        ctx.restore();
        break;
      }
    }
  }
  if(state==='blast'){
    var d9=rel-9;
    if(d9<0){
      var p2=clamp(rel-8,0,1);
      var rad2=(175-p2*80)*u;
      ctx.save();
      ctx.strokeStyle = d9>-goodWindow()?s.accent2:'rgba(255,255,255,0.7)';
      ctx.lineWidth=5*u; ctx.globalAlpha=0.95;
      ctx.beginPath(); ctx.arc(cx,cy,rad2,0,6.28); ctx.stroke();
      ctx.restore();
    }
  }
}

/* ------------------------------- bottle --------------------------------- */
function drawBottle(s){
  var cx=W/2, cy=bottleY(), u=unit();
  var blink = (blinkT<0.09);
  /* emotion for this frame (7-state machine) */
  var em='idle';
  if(state==='shake'){
    if(hitKick>0.5) em=combo>=8?'wow':'happy';
    else em=fizz>0.75?'panic':'focus';
  } else if(state==='blast'){
    if(hitKick>0.4) em=blastWasPerfect?'wow':'happy';
    else em=fizz>0.7?'panic':'focus';
  }
  if(state==='result') em = blastDone?'happy':'shock';
  if(state==='over') em='dead';
  if(state==='countdown') em='focus';

  /* anticipation wind-up: lean away from the upcoming beat */
  var wind=0;
  if(state==='shake'){
    var bf=beatsAt(AC.currentTime), rel=bf-levelStartBeat;
    for(var k=0;k<8;k++){
      if(!hitFlags[k]){
        var tt=k-rel;
        if(tt>0 && tt<0.3){
          wind = -((k%2===0?1:-1))*((0.3-tt)/0.3)*0.17;
        }
        break;
      }
    }
  }
  /* crazy beat full spin */
  var spinExtra=0;
  if(spinT>0){
    spinExtra = ((0.5-spinT)/0.5)*6.283*spinDir;
  }

  ctx.save();
  ctx.translate(cx,cy);
  var idleWob = Math.sin(nowSec()*2.3)*0.02;
  ctx.rotate(wind + bRot + spinExtra + idleWob);
  ctx.scale(bottleSquashX,bottleSquashY);
  ctx.scale(u,u);

  /* shadow */
  ctx.save(); ctx.scale(1,0.3);
  ctx.fillStyle='rgba(0,0,0,0.35)';
  ctx.beginPath(); ctx.arc(0,330,120,0,6.28); ctx.fill();
  ctx.restore();

  /* ---- bottle silhouette ---- */
  ctx.beginPath();
  ctx.moveTo(-34,-176);
  ctx.lineTo(-34,-140);
  ctx.bezierCurveTo(-78,-118,-96,-60,-96,10);
  ctx.bezierCurveTo(-96,200,-70,300,0,300);
  ctx.bezierCurveTo(70,300,96,200,96,10);
  ctx.bezierCurveTo(96,-60,78,-118,34,-140);
  ctx.lineTo(34,-176);
  ctx.closePath();

  /* body fill */
  var bg=ctx.createLinearGradient(-96,0,96,0);
  bg.addColorStop(0,'rgba(255,255,255,0.16)');
  bg.addColorStop(0.25,'rgba(255,255,255,0.42)');
  bg.addColorStop(0.5,'rgba(255,255,255,0.2)');
  bg.addColorStop(1,'rgba(255,255,255,0.08)');
  ctx.fillStyle=bg; ctx.fill();

  /* clip to bottle for liquid + face */
  ctx.save(); ctx.clip();

  /* liquid (fizz pressure fills it up) */
  var topY = 260 - fizz*340;
  var lg=ctx.createLinearGradient(0,topY,0,310);
  lg.addColorStop(0,s.liquid); lg.addColorStop(1,shade(s.liquid,-30));
  ctx.globalAlpha=0.9; ctx.fillStyle=lg;
  ctx.fillRect(-100,topY,200,320);
  ctx.globalAlpha=1;
  /* liquid surface wobble */
  ctx.strokeStyle='rgba(255,255,255,0.5)'; ctx.lineWidth=3;
  ctx.beginPath();
  for(var lx=-100;lx<=100;lx+=8){
    var ly2=topY+Math.sin(lx*0.08+nowSec()*6)*4;
    if(lx===-100) ctx.moveTo(lx,ly2); else ctx.lineTo(lx,ly2);
  }
  ctx.stroke();
  /* dissolved bubbles */
  for(var b2=0;b2<10;b2++){
    var seed=b2*37.3;
    var bx2=((seed*13)%160)-80;
    var rise=(nowSec()*26*(1+fizz*2)+seed*40)%(300-topY);
    ctx.globalAlpha=0.5; ctx.fillStyle='#fff';
    ctx.beginPath(); ctx.arc(bx2,topY+40+rise,2+(b2%3),0,6.28); ctx.fill();
  }
  ctx.globalAlpha=1;
  ctx.restore(); /* unclip */

  /* glass outline + highlight */
  ctx.lineWidth=4; ctx.strokeStyle='rgba(255,255,255,0.6)';
  ctx.beginPath();
  ctx.moveTo(-34,-176);
  ctx.lineTo(-34,-140);
  ctx.bezierCurveTo(-78,-118,-96,-60,-96,10);
  ctx.bezierCurveTo(-96,200,-70,300,0,300);
  ctx.bezierCurveTo(70,300,96,200,96,10);
  ctx.bezierCurveTo(96,-60,78,-118,34,-140);
  ctx.lineTo(34,-176);
  ctx.stroke();
  ctx.strokeStyle='rgba(255,255,255,0.25)'; ctx.lineWidth=10;
  ctx.beginPath();
  ctx.moveTo(-66,-70); ctx.bezierCurveTo(-80,20,-78,160,-52,250);
  ctx.stroke();

  /* ---- label band ---- */
  ctx.save();
  ctx.fillStyle='rgba(255,255,255,0.94)';
  rr(-88,92,176,108,14); ctx.fill();
  ctx.strokeStyle=s.cap; ctx.lineWidth=5;
  rr(-88,92,176,108,14); ctx.stroke();
  ctx.fillStyle=s.cap;
  ctx.font='bold 30px Segoe UI'; ctx.textAlign='center';
  ctx.fillText('FIZZ',0,132);
  ctx.font='bold 13px Segoe UI';
  ctx.fillText(s.label,0,172);
  /* tiny warning */
  ctx.font='9px Segoe UI'; ctx.fillStyle='#888';
  ctx.fillText('DO NOT SHAKE',0,188);
  ctx.restore();

  /* ---- face ---- */
  drawFace(em,blink, s);

  ctx.restore();

  /* cap (only while still on) */
  if(!capFlight && state!=='over'){
    ctx.save();
    ctx.translate(cx,cy); ctx.scale(u,u);
    var capWob=Math.sin(nowSec()*3)*1;
    ctx.fillStyle=s.cap;
    rr(-38,-200+capWob,76,30,6); ctx.fill();
    ctx.fillStyle=shade(s.cap,-30);
    rr(-38,-188+capWob,76,16,4); ctx.fill();
    /* ridges */
    ctx.strokeStyle='rgba(0,0,0,0.25)'; ctx.lineWidth=2;
    for(var rx2=-30;rx2<=30;rx2+=10){
      ctx.beginPath(); ctx.moveTo(rx2,-198+capWob); ctx.lineTo(rx2,-174+capWob); ctx.stroke();
    }
    ctx.restore();
  }
}
function shade(hex,amt){
  var c=hex.replace('#','');
  if(c.length===3) c=c[0]+c[0]+c[1]+c[1]+c[2]+c[2];
  var n=parseInt(c,16);
  var r=clamp((n>>16)+amt,0,255), g=clamp(((n>>8)&255)+amt,0,255), b=clamp((n&255)+amt,0,255);
  return 'rgb('+r+','+g+','+b+')';
}
/* blink timing — autonomous, randomized */
var blinkT=1;
function updateBlink(dt){
  blinkT-=dt;
  if(blinkT<-0.12) blinkT=rand(1.6,4.2);
}

function drawFace(em,blink,s){
  var eyeY=18, eyeDX=38;
  /* pupils track the pointer, unless the blast is imminent — then look up */
  var lookX=clamp(pointer.x/W-0.5,-1,1)*7;
  var lookY=clamp(pointer.y/H-0.5,-1,1)*5;
  if(state==='blast' && !blastDone){ lookX=0; lookY=-8; }
  if(state==='countdown'){ lookX=0; lookY=-3; }
  ctx.save();
  /* blush */
  if(em==='happy'||em==='wow'){
    ctx.globalAlpha=0.55; ctx.fillStyle='#ff8fa3';
    ctx.beginPath(); ctx.arc(-eyeDX-14,eyeY+16,11,0,6.28); ctx.fill();
    ctx.beginPath(); ctx.arc(eyeDX+14,eyeY+16,11,0,6.28); ctx.fill();
    ctx.globalAlpha=1;
  }
  if(em==='dead'){
    ctx.strokeStyle='#333'; ctx.lineWidth=5;
    [-1,1].forEach(function(side){
      var ex=side*eyeDX;
      ctx.beginPath(); ctx.moveTo(ex-12,eyeY-12); ctx.lineTo(ex+12,eyeY+12);
      ctx.moveTo(ex+12,eyeY-12); ctx.lineTo(ex-12,eyeY+12); ctx.stroke();
    });
    /* dead mouth */
    ctx.fillStyle='#5a2a2a';
    ctx.beginPath(); ctx.ellipse(0,66,10,13,0,0,6.28); ctx.fill();
    ctx.restore(); return;
  }
  /* eyebrows */
  ctx.strokeStyle='#2b2030'; ctx.lineWidth=6; ctx.lineCap='round';
  [-1,1].forEach(function(side){
    var ex=side*eyeDX;
    ctx.beginPath();
    if(em==='focus'||em==='panic'){
      ctx.moveTo(ex-13,eyeY-22+(side>0?4:-4));
      ctx.lineTo(ex+13,eyeY-16+(side>0?-4:4));
    } else if(em==='wow'||em==='shock'){
      ctx.moveTo(ex-13,eyeY-28); ctx.lineTo(ex+13,eyeY-28);
    } else {
      ctx.moveTo(ex-13,eyeY-20); ctx.lineTo(ex+13,eyeY-22);
    }
    ctx.stroke();
  });
  /* eyes */
  [-1,1].forEach(function(side){
    var ex=side*eyeDX;
    var rOpen=16, rY=16;
    if(em==='wow'||em==='shock'||em==='panic'){ rOpen=19; rY=20; }
    ctx.fillStyle='#fff';
    ctx.beginPath(); ctx.ellipse(ex,eyeY,rOpen,rY,0,0,6.28); ctx.fill();
    if(blink && em!=='wow' && em!=='shock'){
      ctx.strokeStyle='#333'; ctx.lineWidth=3;
      ctx.beginPath(); ctx.moveTo(ex-rOpen,eyeY); ctx.lineTo(ex+rOpen,eyeY); ctx.stroke();
    } else {
      var px2=ex+lookX, py2=eyeY+lookY;
      if(em==='panic'){ px2=ex-side*4; py2=eyeY-3; }
      ctx.fillStyle='#1c1424';
      ctx.beginPath(); ctx.arc(px2,py2,8,0,6.28); ctx.fill();
      ctx.fillStyle='#fff';
      ctx.beginPath(); ctx.arc(px2-2.5,py2-2.5,2.6,0,6.28); ctx.fill();
    }
  });
  /* mouth */
  ctx.strokeStyle='#3a2230'; ctx.fillStyle='#7a3340'; ctx.lineWidth=4;
  ctx.beginPath();
  switch(em){
    case 'happy':
      ctx.fillStyle='#7a3340';
      ctx.moveTo(-18,58); ctx.quadraticCurveTo(0,86,18,58);
      ctx.quadraticCurveTo(0,68,-18,58); ctx.fill(); break;
    case 'wow':
      ctx.fillStyle='#5a2a34';
      ctx.ellipse(0,68,13,18,0,0,6.28); ctx.fill(); break;
    case 'shock':
      ctx.fillStyle='#5a2a34';
      ctx.ellipse(0,70,16,19,0,0,6.28); ctx.fill(); break;
    case 'panic':
      ctx.strokeStyle='#3a2230';
      ctx.moveTo(-15,70); ctx.lineTo(-5,62); ctx.lineTo(5,72); ctx.lineTo(15,63);
      ctx.stroke(); break;
    case 'focus':
      ctx.moveTo(-11,66); ctx.lineTo(11,66); ctx.stroke(); break;
    default:
      ctx.strokeStyle='#3a2230';
      ctx.moveTo(-9,64); ctx.quadraticCurveTo(0,72,9,64); ctx.stroke();
  }
  ctx.restore();
}
function drawCap(s){
  if(!capFlight) return;
  ctx.save();
  ctx.translate(capFlight.x,capFlight.y);
  ctx.rotate(capFlight.t*14);
  ctx.fillStyle=s.cap;
  rr(-18,-9,36,16,4); ctx.fill();
  ctx.restore();
}

/* ------------------------------- HUD ------------------------------------ */
function drawHUD(s){
  var u=unit();
  ctx.save();
  ctx.textAlign='left';
  ctx.fillStyle='#fff';
  ctx.font='bold '+Math.round(34*u)+'px Segoe UI';
  ctx.fillText(score.toLocaleString(), 20*u, 46*u);
  ctx.font=Math.round(13*u)+'px Segoe UI';
  ctx.fillStyle='rgba(255,255,255,0.6)';
  ctx.fillText('BEST '+best.toLocaleString(), 22*u, 68*u);
  /* level */
  ctx.textAlign='center';
  ctx.font='bold '+Math.round(14*u)+'px Segoe UI';
  ctx.fillStyle='rgba(255,255,255,0.75)';
  ctx.fillText('ROUND '+(level+1)+'  ·  '+s.name, W/2, 30*u);
  /* lives */
  ctx.textAlign='right';
  for(var i=0;i<3;i++){
    ctx.globalAlpha=i<lives?1:0.2;
    ctx.fillStyle=s.accent;
    drawDrop(W-30*u-i*30*u,42*u,10*u);
  }
  ctx.globalAlpha=1;
  /* combo */
  if(combo>=2){
    var cs=1+Math.min(0.5,beatPulse*0.3);
    ctx.save();
    ctx.translate(W/2,H*0.18); ctx.scale(cs,cs);
    ctx.textAlign='center';
    ctx.font='bold '+Math.round(26*u)+'px Segoe UI';
    ctx.fillStyle=s.accent2;
    ctx.fillText(combo+'x COMBO',0,0);
    if(nextMult>1){
      ctx.font='bold '+Math.round(15*u)+'px Segoe UI';
      ctx.fillStyle='#ffe066';
      ctx.fillText('FIZZ x2 INCOMING',0,22*u);
    }
    ctx.restore();
  }
  ctx.restore();

  /* fizz meter */
  var mw=Math.min(W*0.62,340*u), mh=18*u;
  var mx=W/2-mw/2, my=H-44*u;
  ctx.save();
  rr(mx,my,mw,mh,mh/2);
  ctx.fillStyle='rgba(0,0,0,0.4)'; ctx.fill();
  var fw=mw*fizz;
  if(fw>2){
    rr(mx,my,fw,mh,mh/2);
    var fg=ctx.createLinearGradient(0,my,0,my+mh);
    var hot=fizz>0.75;
    fg.addColorStop(0,hot?'#ff5e62':'#ffe066');
    fg.addColorStop(1,hot?'#ff9f43':s.accent);
    ctx.fillStyle=fg; ctx.fill();
  }
  ctx.strokeStyle='rgba(255,255,255,0.5)'; ctx.lineWidth=2;
  rr(mx,my,mw,mh,mh/2); ctx.stroke();
  /* segment ticks */
  for(var t=1;t<10;t++){
    ctx.strokeStyle='rgba(0,0,0,0.25)';
    ctx.beginPath();ctx.moveTo(mx+mw*t/10,my+3);ctx.lineTo(mx+mw*t/10,my+mh-3);ctx.stroke();
  }
  ctx.textAlign='center';
  ctx.font='bold '+Math.round(11*u)+'px Segoe UI';
  ctx.fillStyle='rgba(255,255,255,0.75)';
  ctx.fillText('FIZZ PRESSURE  '+Math.round(fizz*100)+'%',W/2,my-7*u);
  ctx.restore();

  /* stage dots (visual only during play) */
  drawDots(W/2,H-78*u,u);
}
function drawDrop(x,y,r){
  ctx.beginPath();
  ctx.moveTo(x,y-r*1.3);
  ctx.bezierCurveTo(x+r,y-r*0.2,x+r,y+r*0.6,x,y+r);
  ctx.bezierCurveTo(x-r,y+r*0.6,x-r,y-r*0.2,x,y-r*1.3);
  ctx.fill();
}
function drawDots(cx,cy,u){
  var gap=50*u;
  ctx.save();
  for(var i=0;i<5;i++){
    var x=cx+(i-2)*gap;
    ctx.beginPath(); ctx.arc(x,cy,7*u,0,6.28);
    ctx.fillStyle=i===stageIdx?STAGES[i].accent2:'rgba(255,255,255,0.3)';
    ctx.fill();
    ctx.strokeStyle='rgba(255,255,255,0.5)'; ctx.lineWidth=1.5; ctx.stroke();
  }
  ctx.restore();
}
function drawMute(s){

  if(muted){ ctx.beginPath();ctx.moveTo(-14,-14);ctx.lineTo(14,14);ctx.stroke(); }

}
function drawFloaters(s){

}
/* 3-2-1 beat countdown numbers */

}

var buttons=[];
function drawTitle(s){

  ctx.translate(W/2,H*0.44+bob);
  ctx.scale(u*0.9,u*0.9);
  ctx.fillStyle='rgba(0,0,0,0.3)';
  ctx.save();ctx.scale(1,0.3);ctx.beginPath();ctx.arc(0,260,100,0,6.28);ctx.fill();ctx.restore();
  ctx.fillStyle='rgba(255,255,255,0.3)';
  ctx.beginPath();
  ctx.moveTo(-34,-176);ctx.lineTo(-34,-140);
  ctx.bezierCurveTo(-78,-118,-96,-60,-96,10);
  ctx.bezierCurveTo(-96,200,-70,260,0,260);
  ctx.bezierCurveTo(70,260,96,200,96,10);
  ctx.bezierCurveTo(96,-60,78,-118,34,-140);
  ctx.lineTo(34,-176);ctx.closePath(); ctx.fill();
  ctx.fillStyle=s.liquid; ctx.globalAlpha=0.6;
  ctx.beginPath(); ctx.ellipse(0,150,90,80,0,0,6.28);ctx.fill();
  ctx.globalAlpha=1;
  ctx.fillStyle=s.cap; rr(-38,-200,76,30,6);ctx.fill();
  ctx.fillStyle='#fff';
  ctx.font='bold 26px Segoe UI'; ctx.fillText('FIZZ',0,120);
  drawFace('idle', blinkT<0.09, s);
  ctx.restore();

  /* title */
  ctx.font='bold '+Math.round(52*u)+'px Segoe UI';
  var tg=ctx.createLinearGradient(0,H*0.08,0,H*0.2);
  tg.addColorStop(0,s.accent); tg.addColorStop(1,s.accent2);
  ctx.fillStyle=tg;
  ctx.fillText('SHAKE BLAST',W/2,H*0.12);
  ctx.font='bold '+Math.round(16*u)+'px Segoe UI';
  ctx.fillStyle='rgba(255,255,255,0.8)';
  ctx.fillText('FIZZ LAWSUIT',W/2,H*0.165);
  ctx.font=Math.round(13*u)+'px Segoe UI';
  ctx.fillStyle='rgba(255,255,255,0.6)';
  ctx.fillText('SMALL SHAKE. UNIVERSAL CONSEQUENCES.',W/2,H*0.22);
  if(best>0){
    ctx.font='bold '+Math.round(14*u)+'px Segoe UI';
    ctx.fillStyle=s.accent;
    ctx.fillText('BEST '+best.toLocaleString(),W/2,H*0.74);
  }
  /* PLAY */
  var bw2=220*u,bh2=66*u,bx=W/2-bw2/2,by=H*0.8;
  buttons.push({x:bx,y:by,w:bw2,h:bh2,act:'play'});
  var pg=ctx.createLinearGradient(0,by,0,by+bh2);
  pg.addColorStop(0,s.accent); pg.addColorStop(1,s.accent2);
  rr(bx,by,bw2,bh2,bh2/2); ctx.fillStyle=pg; ctx.fill();
  ctx.fillStyle='#140d1f';
  ctx.font='bold '+Math.round(24*u)+'px Segoe UI';
  ctx.fillText('PLAY',W/2,by+43*u);
  /* stage dots: 44px touch targets, wider gap */
  ctx.font=Math.round(12*u)+'px Segoe UI';
  ctx.fillStyle='rgba(255,255,255,0.75)';
  ctx.fillText(STAGES[stageIdx].name,W/2,H*0.89);
  var gap=50*u;
  for(var i=0;i<5;i++){
    var dx=W/2+(i-2)*gap, dy=H*0.925;
    buttons.push({x:dx-22*u,y:dy-22*u,w:44*u,h:44*u,act:'stage',v:i});
    ctx.beginPath();ctx.arc(dx,dy,12*u,0,6.28);
    ctx.fillStyle=i===stageIdx?STAGES[i].accent2:'rgba(255,255,255,0.25)';ctx.fill();
    ctx.strokeStyle='rgba(255,255,255,0.6)';ctx.lineWidth=2;ctx.stroke();
  }
  ctx.font=Math.round(11*u)+'px Segoe UI';
  ctx.fillStyle='rgba(255,255,255,0.5)';
  ctx.fillText('TAP / CLICK / SPACE ON THE BEAT  ·  KEYS 1-5 SWITCH STAGE',W/2,H*0.97);
  ctx.restore();
  drawMute(s);
}

/* ---------------------------- game over --------------------------------- */
function drawGameOver(s){
  var u=unit();
  buttons=[];
  ctx.save();
  ctx.fillStyle='rgba(0,0,0,0.6)'; ctx.fillRect(-26,-26,W+52,H+52);
  ctx.textAlign='center';
  ctx.font='bold '+Math.round(46*u)+'px Segoe UI';
  ctx.fillStyle='#ff5e62';
  ctx.fillText('FIZZ FLAT!',W/2,H*0.24);
  ctx.font=Math.round(15*u)+'px Segoe UI';
  ctx.fillStyle='rgba(255,255,255,0.7)';
  ctx.fillText('THE BOTTLE IS PURSUING LEGAL ACTION',W/2,H*0.285);
  ctx.font='bold '+Math.round(34*u)+'px Segoe UI';
  ctx.fillStyle='#fff';
  ctx.fillText(score.toLocaleString(),W/2,H*0.39);
  ctx.font=Math.round(13*u)+'px Segoe UI';
  ctx.fillStyle='rgba(255,255,255,0.6)';
  ctx.fillText('BEST '+best.toLocaleString(),W/2,H*0.43);
  if(score>=best&&score>0){
    ctx.font='bold '+Math.round(18*u)+'px Segoe UI';
    ctx.fillStyle='#ffe066';
    ctx.fillText('NEW BEST!',W/2,H*0.49);
  }
  ctx.font=Math.round(13*u)+'px Segoe UI';
  ctx.fillStyle='rgba(255,255,255,0.6)';
  ctx.fillText('MAX COMBO '+maxCombo+'x',W/2,H*0.54);
  /* buttons */
  var bw3=200*u,bh3=60*u,by2=H*0.63,bx2=W/2-bw3/2;
  buttons.push({x:bx2,y:by2,w:bw3,h:bh3,act:'replay'});
  var pg2=ctx.createLinearGradient(0,by2,0,by2+bh3);
  pg2.addColorStop(0,s.accent);pg2.addColorStop(1,s.accent2);
  rr(bx2,by2,bw3,bh3,bh3/2);ctx.fillStyle=pg2;ctx.fill();
  ctx.fillStyle='#140d1f';ctx.font='bold '+Math.round(22*u)+'px Segoe UI';
  ctx.fillText('REPLAY',W/2,by2+39*u);

  var bmy=H*0.745,bmh=48*u;
  buttons.push({x:W/2-bw3/2,y:bmy,w:bw3,h:bmh,act:'menu'});
  rr(W/2-bw3/2,bmy,bw3,bmh,bmh/2);
  ctx.fillStyle='rgba(255,255,255,0.14)';ctx.fill();
  ctx.strokeStyle='rgba(255,255,255,0.4)';ctx.lineWidth=2;
  rr(W/2-bw3/2,bmy,bw3,bmh,bmh/2);ctx.stroke();
  ctx.fillStyle='#fff';ctx.font='bold '+Math.round(16*u)+'px Segoe UI';
  ctx.fillText('MENU',W/2,bmy+31*u);

  /* stage dots: 44px targets */
  var gap2=50*u;
  for(var i=0;i<5;i++){
    var dx=W/2+(i-2)*gap2,dy=H*0.86;
    buttons.push({x:dx-22*u,y:dy-22*u,w:44*u,h:44*u,act:'stage',v:i});
    ctx.beginPath();ctx.arc(dx,dy,12*u,0,6.28);
    ctx.fillStyle=i===stageIdx?STAGES[i].accent2:'rgba(255,255,255,0.25)';ctx.fill();
    ctx.strokeStyle='rgba(255,255,255,0.6)';ctx.lineWidth=2;ctx.stroke();
  }
  ctx.restore();
}

/* ----------------------------- pointer ---------------------------------- */
var pointer={x:0,y:0};
function hit(x,y){
  /* mute button */
  var u=unit();
  if(x>W-46*u && y>H-46*u){
    setMuted(!muted); sfxClick(); return;
  }
  for(var i=0;i<buttons.length;i++){
    var b=buttons[i];
    if(x>=b.x&&x<=b.x+b.w&&y>=b.y&&y<=b.y+b.h){
      if(b.act==='play'){ sfxClick(); startGame(); }
      else if(b.act==='replay'){ sfxClick(); startGame(); }
      else if(b.act==='menu'){ sfxClick(); state='title'; }
      else if(b.act==='stage'){ stageIdx=b.v; pReset(); sfxClick(); }
      return;
    }
  }
  press();
}
canvas.addEventListener('pointerdown',function(e){
  e.preventDefault();
  var r=canvas.getBoundingClientRect();
  pointer.x=e.clientX-r.left; pointer.y=e.clientY-r.top;
  /* audio unlocks on the very first gesture */
  if(!AC){ initAudio(); if(AC.state==='suspended')AC.resume(); }
  hit(pointer.x,pointer.y);
},{passive:false});
canvas.addEventListener('pointermove',function(e){
  var r=canvas.getBoundingClientRect();
  pointer.x=e.clientX-r.left; pointer.y=e.clientY-r.top;
},{passive:true});

/* keyboard — same abstract ACTIONS as taps */
window.addEventListener('keydown',function(e){
  if(e.repeat) return;
  var k=e.key;
  if(k===' '||k==='Enter'||k==='ArrowUp'){
    e.preventDefault();
    if(!AC && (state==='shake'||state==='blast')){ initAudio(); if(AC.state==='suspended')AC.resume(); }
    if(state==='title'){ startGame(); }
    else if(state==='over'){ startGame(); }
    else press();
  }
  if(k>='1'&&k<='5'){ stageIdx=parseInt(k,10)-1; pReset(); }
  if(k==='m'||k==='M'){ setMuted(!muted); }
});

/* ------------------------------ resize ---------------------------------- */
function resize(){
  DPR=Math.min(window.devicePixelRatio||1,2);
  W=window.innerWidth; H=window.innerHeight;
  canvas.width=Math.round(W*DPR); canvas.height=Math.round(H*DPR);
  canvas.style.width=W+'px'; canvas.style.height=H+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
}
window.addEventListener('resize',resize);
window.addEventListener('orientationchange',function(){ setTimeout(resize,200); });

/* tab hide suspends audio + pauses the loop in sync with visuals */
document.addEventListener('visibilitychange',function(){
  if(!AC) return;
  if(document.hidden) AC.suspend();
  else AC.resume();
});
window.addEventListener('pagehide',function(){ if(AC) AC.suspend(); });

/* ------------------------------- boot ----------------------------------- */
resize();
/* autonomous blink loop */
var blinkLast=performance.now();
(function blinkLoop(){
  var now2=performance.now(), dt2=Math.min(0.1,(now2-blinkLast)/1000);
  blinkLast=now2;
  updateBlink(dt2);
  requestAnimationFrame(blinkLoop);
})();
requestAnimationFrame(frame);
/* idempotent triple-fallback kick: re-render after load + focus so the
   title scene can never paint blank from a background/inactive tab */
window.addEventListener('load',resize);
window.addEventListener('focus',function(){ setTimeout(resize,60); });
</script>
